name: Repair non-ZIP classification

on:
  push:
    branches: [security/public-signing-containment-v1]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  repair:
    if: github.ref_name == 'security/public-signing-containment-v1' || github.head_ref == 'security/public-signing-containment-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: security/public-signing-containment-v1
          fetch-depth: 1
          show-progress: false
      - name: Add explicit ZIP signature refusal
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('antivirus/src/main/java/com/understory/antivirus/RawApkParser.kt')
          text = path.read_text()
          old = '''        var manifestBytes: ByteArray? = null
        var manifestEntries = 0
        try {
            ZipInputStream(BufferedInputStream(NonClosingInputStream(fis))).use { zis ->
'''
          new = '''        var manifestBytes: ByteArray? = null
        var manifestEntries = 0
        val zipHeader = ByteArray(4)
        val hasLocalFileHeader = runCatching {
            readFully(fis.channel, 0, zipHeader)
            u32(zipHeader, 0) == 0x04034b50L
        }.getOrDefault(false)
        if (!hasLocalFileHeader) {
            flags += ApkParseResult.FLAG_BAD_ZIP
        } else try {
            ZipInputStream(BufferedInputStream(NonClosingInputStream(fis))).use { zis ->
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one phase-2 parser block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
      - name: Commit parser repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add antivirus/src/main/java/com/understory/antivirus/RawApkParser.kt
          git commit -m "Reject non-ZIP input before APK parsing"
          git push origin HEAD:security/public-signing-containment-v1
