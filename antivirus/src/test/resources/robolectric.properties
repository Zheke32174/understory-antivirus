# Robolectric 4.13 (the suite-wide pin) simulates up to API 34, but this app
# module targets SDK 35 — without an explicit pin every Robolectric test dies
# in DefaultSdkPicker with "Package targetSdkVersion=35 > maxSdkVersion=34"
# before running a single assertion (the library modules dodge this only
# because they declare no targetSdk). Pin the simulated API to the newest
# level Robolectric 4.13 supports; drop this file when the Robolectric pin
# moves to 4.14+ (which knows API 35).
sdk=34
